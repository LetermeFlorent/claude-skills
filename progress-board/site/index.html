<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avancement</title>
<script>const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th;</script>
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb; --text: #1b2130; --muted: #7a8194; --grid: #eef1f6; --grid-strong: #dfe5ef; --axis: #9aa1b2; --track: #eceef2;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  }
  /* Dark follows the system unless the settings force a theme. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #1a1a19; --text: #e7e9ee; --muted: #8e95a7; --grid: #222321; --grid-strong: #2d2e2c; --axis: #5f6472; --track: #2a2b29;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1a19; --text: #e7e9ee; --muted: #8e95a7; --grid: #222321; --grid-strong: #2d2e2c; --axis: #5f6472; --track: #2a2b29;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; } /* the page itself never scrolls, whatever the window size */
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 32px 40px 24px;
  }
  @media (max-width: 640px), (max-height: 420px) { body { padding: 28px 12px 10px; gap: 12px; } }
  .plot { position: relative; min-height: 0; }
  /* No scrollbar: the chart moves by dragging it with the mouse. */
  .scroll { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
  .scroll.drag { cursor: grabbing; }
  .scroll svg { display: block; height: 100%; }
  .yaxis { position: absolute; left: 0; top: 0; width: 30px; height: 100%; overflow: visible; pointer-events: none; }
  .tip {
    position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--grid-strong);
    border-radius: 8px; padding: 5px 9px; font-size: 12.5px; white-space: nowrap; opacity: 0; transition: opacity .12s;
  }
  .tip span { color: var(--muted); }
  /* Jump to the oldest or the newest time; each shows only when there is something that way. */
  .jump { position: absolute; top: 50%; translate: 0 -50%; width: 28px; height: 28px; padding: 5px; border: 1px solid var(--grid-strong); border-radius: 50%; background: var(--bg); color: var(--muted); cursor: pointer; opacity: .8; }
  .jump:hover, .jump:focus-visible { opacity: 1; color: var(--text); }
  .jump[hidden] { display: none; }
  #toL { left: 36px; } #toR { right: 0; }
  .dim { opacity: .15; }
  #svg path, #svg text, #svg g, #svg line { transition: opacity .2s; }
  /* One row of fixed height: the chart never changes size when projects come and go. */
  .cards { display: flex; align-items: center; gap: 24px; height: 70px; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; scrollbar-width: thin; }
  .card { flex: 0 0 160px; display: grid; grid-template-columns: auto 1fr auto; column-gap: 8px; row-gap: 7px; align-items: center; cursor: pointer; transition: opacity .2s; }
  .card.dim { opacity: .4; }
  .card .ico { width: 20px; height: 20px; }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .step { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pct { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .card .pct small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .card .bar { grid-column: 1 / -1; height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .card .bar > i { display: block; height: 100%; transition: width .7s ease; }
  .card.pill { flex: 0 0 auto; display: inline-flex; gap: 6px; color: var(--muted); font-size: 12.5px; text-decoration: line-through; text-decoration-color: var(--axis); }
  .card.pill .ico { width: 15px; height: 15px; opacity: .75; }
  .card.pill .pct, .card.pill .bar, .card.pill .step { display: none; }
  .card.pill .name { font-weight: 400; }
  .empty { color: var(--muted); }
  /* With no project, the page shows only this line (and the settings button). */
  .none { display: none; position: fixed; inset: 0; place-items: center; color: var(--muted); font-size: 15px; pointer-events: none; }
  body.nothing .none { display: grid; }
  body.nothing .plot, body.nothing .cards, body.loading .plot, body.loading .cards { opacity: 0; pointer-events: none; } /* loading: nothing shows before the first data */

  .gear { position: fixed; top: 6px; right: 10px; width: 28px; height: 28px; padding: 3px; border: 0; background: none; color: var(--muted); opacity: .6; cursor: pointer; }
  .gear:hover, .gear:focus-visible { opacity: 1; }
  dialog { border: 1px solid var(--grid-strong); border-radius: 12px; background: var(--bg); color: var(--text); padding: 18px 22px; width: min(380px, 92vw); }
  dialog::backdrop { background: rgb(0 0 0 / .3); }
  .tabs { display: flex; gap: 4px; margin: -4px 0 16px; border-bottom: 1px solid var(--grid-strong); }
  dialog .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px; margin-bottom: -1px; color: var(--muted); font-weight: 600; }
  dialog .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--s1); }
  #nProj { font-weight: 400; color: var(--muted); }
  .pane { min-height: 236px; } /* both tabs keep the window the same height */
  .pane[hidden] { display: none; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { padding: 0; margin-bottom: 6px; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row > span:first-child { flex: 1; }
  .row .u { width: 26px; color: var(--muted); }
  dialog input, dialog select, dialog button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--grid-strong); border-radius: 6px; padding: 3px 8px; }
  dialog input[type=number] { width: 76px; text-align: right; }
  dialog button { cursor: pointer; }
  #cList { list-style: none; margin: 0 0 12px; padding: 0; max-height: 224px; overflow-y: auto; }
  #cList li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  #cList li .ico { width: 16px; height: 16px; flex: none; }
  #cList li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cList li button { border: 0; color: var(--muted); padding: 0 6px; }
  #cList li button:hover { color: var(--s8); }
  .danger { color: var(--s8) !important; border-color: currentColor !important; }
  .danger:disabled { opacity: .4; cursor: default; }
  .foot { display: flex; gap: 8px; }
  .foot button[value="close"] { margin-left: auto; }
  .foot button[hidden] { display: none; }
</style>
</head>
<body class="loading">
<div class="plot" id="plot">
  <div class="scroll" id="scroll">
    <svg id="svg" role="img" aria-label="Avancement de chaque projet dans le temps">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--axis)"/></marker>
        <pattern id="paper" patternUnits="userSpaceOnUse"></pattern>
      </defs>
      <rect id="paperRect" fill="url(#paper)"/>
      <g id="gTime" font-size="10.5" fill="var(--muted)" text-anchor="middle"></g>
      <line id="xaxis" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#arr)"/>
      <line id="yline" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#arr)"/>
      <g id="gLines" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></g>
      <g id="gDots" fill="none" stroke-width="6" stroke-linecap="round"></g>
      <g id="gLinks"></g>
      <g id="gLabels" font-size="12" font-weight="600" fill="var(--text)" stroke="var(--bg)" stroke-width="4" paint-order="stroke" text-anchor="middle"></g>
      <g id="gIcons"></g>
      <circle id="hov" r="4.5" fill="var(--bg)" stroke-width="2" opacity="0"/>
    </svg>
  </div>
  <svg class="yaxis" id="yaxis" aria-hidden="true"></svg>
  <button class="jump" id="toL" title="Tout à gauche" aria-label="Aller au début" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v10M13 3L7 8l6 5"/></svg></button>
  <button class="jump" id="toR" title="Tout à droite" aria-label="Aller à maintenant" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v10M3 3l6 5-6 5"/></svg></button>
  <div class="tip" id="tip"></div>
</div>
<footer class="cards" id="cards"></footer>
<div class="none" id="none">Aucun projet</div>

<button class="gear" id="gear" title="Réglages" aria-label="Réglages">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
</button>
<dialog id="dlg">
  <form method="dialog">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabCfg" aria-selected="true" aria-controls="panCfg">Réglages</button>
      <button type="button" role="tab" id="tabProj" aria-selected="false" aria-controls="panProj">Projets <span id="nProj"></span></button>
    </div>
    <div class="pane" id="panCfg" role="tabpanel">
    <fieldset>
      <legend>Durées</legend>
      <label class="row"><span>Temps visible sur la largeur</span><input type="number" id="cWindow" min="1" max="1440" step="1"><span class="u">min</span></label>
      <label class="row"><span>Projet fini retiré après</span><input type="number" id="cDone" min="1" max="10080" step="1"><span class="u">min</span></label>
      <label class="row"><span>Projet sans nouvelle retiré après</span><input type="number" id="cIdle" min="1" max="60" step="1"><span class="u">j</span></label>
    </fieldset>
    <fieldset>
      <legend>Thème</legend>
      <label class="row"><span>Apparence</span><select id="cTheme"><option value="">Système</option><option value="light">Clair</option><option value="dark">Sombre</option></select></label>
    </fieldset>
    </div>
    <div class="pane" id="panProj" role="tabpanel" hidden>
      <ul id="cList"></ul>
    </div>
    <div class="foot"><button type="button" class="danger" id="cClear" hidden>Tout effacer</button><button value="close">Fermer</button></div>
  </form>
</dialog>

<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const make = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); setAttrs(e, attrs); parent.appendChild(e); return e; };
  // Writes an attribute only when its value changes, so untouched elements stay untouched.
  const setAttrs = (e, attrs) => { for (const k in attrs) { const v = String(attrs[k]); if (e.getAttribute(k) !== v) e.setAttribute(k, v); } };
  const setText = (e, t) => { if (e.textContent !== t) e.textContent = t; };
  const hhmm = ts => new Date(ts * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  const hms = ts => new Date(ts * 1000).toLocaleTimeString("fr-FR");
  const dayh = ts => new Date(ts * 1000).toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit" });

  // White glyphs on a colored disc; 24x24 viewBox. The server picks one at random per project.
  const ICONS = {
    star: "M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z",
    bolt: "M13 2L4 14h6l-1 8 9-12h-6z",
    heart: "M12 21s-7.5-4.6-9.5-9C1 8.5 3.5 5 7 5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.5 0 6 3.5 4.5 7-2 4.4-9.5 9-9.5 9z",
    moon: "M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z",
    diamond: "M12 2l8 10-8 10-8-10z",
    flame: "M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z",
    crown: "M3 18h18l-1-10-5 4-3-7-3 7-5-4z",
    leaf: "M5 20C4 10 10 4 20 4c0 10-6 16-15 16z"
  };
  const color = p => `var(--s${(p.slot % 8) + 1})`;
  const glyph = (p, r) =>
    `<circle r="${r}" fill="${color(p)}" stroke="var(--bg)" stroke-width="2.5"/>` +
    `<path d="${ICONS[p.icon] || ICONS.star}" fill="#fff" transform="translate(${-r * .6} ${-r * .6}) scale(${r * 1.2 / 24})"/>`;
  const icoSvg = (p, cls) => `<svg class="${cls}" viewBox="-16 -16 32 32">${glyph(p, 14)}</svg>`;
  const last = p => p.history.at(-1);

  let projects = [], pts = [], version = null, queued = false, focus = null, center = null;
  let cfg = { window: 3600, done: 3600, idle: 3 * 86400 };
  const els = new Map(); // project name -> its chart and card elements
  const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; sync(); draw(); }); } };

  // Server sends the full state ({projects, cfg, v}) or one changed project ({p}).
  function apply(msg) {
    if (msg.v) { if (version && msg.v !== version) return location.reload(); version = msg.v; } // page file changed
    if (msg.cfg) { cfg = msg.cfg; if ($("dlg").open) fillCfg(); }
    if (msg.projects) projects = msg.projects;
    else { const i = projects.findIndex(q => q.name === msg.p.name); i < 0 ? projects.push(msg.p) : projects[i] = msg.p; }
    projects = projects.filter(p => p.history && p.history.length);
    schedule();
  }

  // Creates elements for new projects, drops those of vanished ones, keeps every other node as is.
  function sync() {
    for (const [name, el] of els) {
      const p = projects.find(q => q.name === name);
      if (p && el.key === p.slot + p.icon) continue; // still shown, same color and icon
      Object.values(el).forEach(n => n instanceof Element && n.remove());
      els.delete(name);
    }
    for (const p of projects) {
      if (els.has(p.name)) continue;
      const el = { key: p.slot + p.icon };
      el.path = make("path", { stroke: color(p) }, $("gLines"));
      el.dots = make("path", { stroke: color(p) }, $("gDots"));
      el.slide = make("line", { stroke: color(p), "stroke-width": 2, visibility: "hidden" }, $("gLinks"));
      el.leader = make("line", { stroke: "var(--axis)", "stroke-dasharray": "2 2", visibility: "hidden" }, $("gLinks"));
      el.label = make("text", {}, $("gLabels")); el.label.textContent = p.name;
      el.glyph = make("g", {}, $("gIcons")); el.glyph.innerHTML = glyph(p, 12);
      el.card = document.createElement("div");
      el.card.innerHTML = icoSvg(p, "ico") + `<div style="min-width:0"><div class="name"></div><div class="step"></div></div>` +
        `<div class="pct"><span></span><small>%</small></div><div class="bar"><i style="background:${color(p)}"></i></div>`;
      el.card.querySelector(".name").textContent = p.name;
      el.card.onclick = () => toggleFocus(p.name);
      els.set(p.name, el);
    }
    // Cards: same order as the chart, top to bottom; a finished project shrinks to its icon and name.
    const order = [...projects].sort((a, b) => last(b).v - last(a).v || last(b).ts - last(a).ts);
    const row = $("cards");
    order.forEach((p, i) => {
      const el = els.get(p.name), v = last(p).v, c = el.card;
      const cls = (v >= 100 ? "card pill" : "card") + (focus && focus !== p.name ? " dim" : "");
      if (c.className !== cls) c.className = cls;
      const title = (v >= 100 ? "terminé à " + hhmm(last(p).ts) + " · " : "") + "cliquer pour le voir sur le graphique";
      if (c.title !== title) c.title = title;
      setText(c.querySelector(".step"), p.step || "");
      setText(c.querySelector(".pct span"), String(v));
      const bar = c.querySelector(".bar i"); if (bar.style.width !== v + "%") bar.style.width = v + "%";
      if (row.children[i] !== c) row.insertBefore(c, row.children[i] || null); // moves only what is out of place
    });
    document.body.classList.toggle("nothing", !projects.length);
    document.body.classList.remove("loading");
    if (focus && !els.has(focus)) focus = null;
    for (const [name, el] of els) for (const k of ["path", "dots", "slide", "leader", "label", "glyph"]) el[k].classList.toggle("dim", !!focus && focus !== name);
    if ($("dlg").open) list();
  }

  // A click on a card (or on a line) brings that project into view and fades the others; a second click undoes it.
  function toggleFocus(name) {
    focus = focus === name ? null : name;
    center = focus;
    schedule();
  }

  // Monotone cubic (Fritsch-Carlson): smooth, yet never bulges past a reported value or below the ground.
  function smooth(ps) {
    const n = ps.length, d = [], m = [];
    let s = `M${ps[0].x} ${ps[0].y}`;
    if (n < 2) return s;
    for (let i = 0; i < n - 1; i++) { const dx = ps[i + 1].x - ps[i].x; d[i] = dx ? (ps[i + 1].y - ps[i].y) / dx : 0; }
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (!d[i]) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], q = a * a + b * b;
      if (q > 9) { const t = 3 / Math.sqrt(q); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    for (let i = 0; i < n - 1; i++) {
      const p0 = ps[i], p1 = ps[i + 1], dx = (p1.x - p0.x) / 3;
      s += dx ? `C${p0.x + dx} ${p0.y + m[i] * dx} ${p1.x - dx} ${p1.y - m[i + 1] * dx} ${p1.x} ${p1.y}` : `L${p1.x} ${p1.y}`;
    }
    return s;
  }

  // One line per project, percent over shared clock time; only the last point is marked.
  // At most cfg.window seconds fill the width; older time is reached by dragging the chart.
  const L = 30, R = 110, T = 40, B = 24; // right room lets a name sit beside its icon
  let sizeKey = "";
  const tickEls = new Map(); // x -> time label
  function draw() {
    const sc = $("scroll"), svg = $("svg");
    const follow = sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 4; // stay on the newest time unless dragged back
    const W = sc.clientWidth, H = sc.clientHeight, w = W - L - R, h = H - T - B;
    if (w < 80 || h < 60) return;
    const y = v => T + h - v * h / 100, step = h / 20; // graph paper: 5-point squares, stronger line every 25

    if (sizeKey !== W + "x" + H) { // backdrop and value axis: rebuilt only when the window is resized
      sizeKey = W + "x" + H;
      const P = step * 5;
      let pat = "";
      for (let k = 0; k < 5; k++) pat += `<line x1="${k * step}" x2="${k * step}" y2="${P}" stroke="var(${k ? "--grid" : "--grid-strong"})"/><line y1="${k * step}" y2="${k * step}" x2="${P}" stroke="var(${k ? "--grid" : "--grid-strong"})"/>`;
      setAttrs($("paper"), { x: L, y: T, width: P, height: P });
      $("paper").innerHTML = pat;
      // Value labels stay put while the chart moves; the axis line itself is drawn under the curves (yline).
      let ya = `<rect width="${L - 1}" height="${H}" fill="var(--bg)"/>`;
      for (const v of [0, 50, 100]) ya += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v}</text>`;
      $("yaxis").innerHTML = ya;
    }

    const all = projects.flatMap(p => p.history.map(d => d.ts));
    const t0 = all.length ? Math.min(...all) : Date.now() / 1000 - 3600;
    const shown = Math.min(Math.max(60, Math.max(t0, ...all) - t0), cfg.window);
    const span = Math.max(60, Math.max(t0, ...all) - t0), pxs = w / shown;
    const CW = L + span * pxs + R, x = ts => L + (ts - t0) * pxs; // the first 0 % sits in the corner
    if (svg.style.width !== CW + "px") svg.style.width = CW + "px";
    setAttrs($("paperRect"), { x: L, y: T, width: CW - L - R, height: h });
    setAttrs($("xaxis"), { x1: L, y1: T + h, x2: CW - R + 12, y2: T + h });

    const c = center && projects.find(p => p.name === center);
    center = null;
    if (c) sc.scrollLeft = x(last(c).ts) - W / 2;
    else if (follow) sc.scrollLeft = CW - W;
    const vl = sc.scrollLeft + L, vr = sc.scrollLeft + W; // visible part, right of the value axis
    setAttrs($("yline"), { x1: vl, y1: T + h, x2: vl, y2: T - 12 });

    const fmt = shown < 600 ? hms : span > 20 * 3600 ? dayh : hhmm;
    const ticks = [];
    for (let px = 0; px <= span * pxs + .5; px += 110) ticks.push([L + px, fmt(t0 + px / pxs)]);
    // Time labels keyed by position: a new tick adds one node, the others stay as they are.
    const seen = new Set(), keep = new Set();
    for (const [tx, lab] of ticks) {
      if (seen.has(lab)) continue;
      seen.add(lab); keep.add(tx);
      let t = tickEls.get(tx);
      if (!t) { t = make("text", { x: tx }, $("gTime")); tickEls.set(tx, t); }
      setText(t, lab);
      const half = lab.length * 3.2; // no half-cut time at either edge
      setAttrs(t, { y: T + h + 17, visibility: tx - half < vl || tx + half > vr ? "hidden" : "visible" });
    }
    for (const [tx, t] of tickEls) if (!keep.has(tx)) { t.remove(); tickEls.delete(tx); }

    pts = [];
    const ends = [];
    for (const p of projects) {
      const el = els.get(p.name), hs = p.history.map(d => ({ x: x(d.ts), y: y(d.v), d, p }));
      pts.push(...hs);
      setAttrs(el.path, { d: smooth(hs) }); // the server starts every line with a 0 % point
      // A dot per report; not the 0 % the server added under the first one, nor the last, which wears the icon.
      const added = hs.length > 1 && hs[0].d.v === 0 && hs[1].d.ts === hs[0].d.ts && hs[1].d.v !== 0;
      setAttrs(el.dots, { d: hs.slice(added ? 1 : 0, -1).map(q => `M${q.x} ${q.y}h0`).join("") });
      ends.push({ ...hs.at(-1), el });
    }

    // An icon whose last report sits out of view stays pinned to the edge, a dashed line pointing to it,
    // so every project is always visible. Icons that land on the same spot step aside.
    ends.forEach(e => { e.ix = Math.min(Math.max(e.x, vl + 16), vr - 16); e.dir = e.x < vl + 16 ? 28 : -28; });
    ends.sort((a, b) => b.ix - a.ix || a.p.name.localeCompare(b.p.name)).forEach((e, k) => {
      while (ends.slice(0, k).some(o => Math.hypot(o.ix - e.ix, o.y - e.y) < 26)) e.ix += e.dir;
      const out = e.x < vl || e.x > vr;
      setAttrs(e.el.slide, e.ix !== e.x ? { x1: e.ix, y1: e.y, x2: e.x, y2: e.y, "stroke-dasharray": out ? "3 4" : "none", visibility: "visible" } : { visibility: "hidden" });
      setAttrs(e.el.glyph, { transform: `translate(${e.ix} ${e.y})` });
    });

    // Name above each end icon; when taken, beside it on the right or left, then below; last resort, climb or sink.
    const placed = ends.map(e => ({ x: e.ix - 14, y: e.y - 14, w: 28, h: 28 }));
    const hits = (lx, ly, lw, lh) => placed.some(b => lx < b.x + b.w + 2 && lx + lw + 2 > b.x && ly < b.y + b.h + 2 && ly + lh + 2 > b.y);
    const fit = (lx, lw) => Math.min(Math.max(lx, vl + 2), vr - lw - 2);
    ends.sort((a, b) => a.y - b.y || a.p.name.localeCompare(b.p.name)).forEach(e => {
      const lw = e.p.name.length * 7 + 6, lh = 16;
      const spots = [[e.ix - lw / 2, e.y - 18 - lh], [e.ix + 18, e.y - lh / 2], [e.ix - 18 - lw, e.y - lh / 2], [e.ix - lw / 2, e.y + 18]]
        .map(([a, b]) => [fit(a, lw), b]).filter(([, b]) => b >= 2 && b + lh <= H - 2);
      let [lx, ly] = spots.find(([a, b]) => !hits(a, b, lw, lh)) || spots[0] || [fit(e.ix - lw / 2, lw), 2];
      const dy = ly < e.y ? -(lh + 2) : lh + 2; // climb from above, sink from below, never off the chart
      while (hits(lx, ly, lw, lh) && ly + dy >= 2 && ly + dy + lh <= H - 2) ly += dy;
      placed.push({ x: lx, y: ly, w: lw, h: lh });
      setAttrs(e.el.leader, ly + lh < e.y - 16 ? { x1: e.ix, y1: ly + lh, x2: e.ix, y2: e.y - 13, visibility: "visible" } : { visibility: "hidden" });
      setAttrs(e.el.label, { x: lx + lw / 2, y: ly + 12 });
    });

    const atL = sc.scrollLeft < 2, atR = sc.scrollLeft + W >= sc.scrollWidth - 2;
    if ($("toL").hidden !== atL) $("toL").hidden = atL;
    if ($("toR").hidden !== atR) $("toR").hidden = atR;
  }

  // Mouse: drag to move through time, click a line or icon to focus it, hover for the value.
  const sc = $("scroll");
  let drag = null;
  function nearest(e) {
    if (!pts.length) return null;
    const r = sc.getBoundingClientRect(), mx = e.clientX - r.left + sc.scrollLeft, my = e.clientY - r.top;
    const q = pts.reduce((a, b) => Math.hypot(b.x - mx, b.y - my) < Math.hypot(a.x - mx, a.y - my) ? b : a);
    return Math.hypot(q.x - mx, q.y - my) <= 40 ? q : null;
  }
  function hideTip() { $("tip").style.opacity = 0; $("hov").setAttribute("opacity", 0); }
  function hover(e) {
    const q = nearest(e), tip = $("tip");
    if (!q) return hideTip();
    setAttrs($("hov"), { cx: q.x, cy: q.y, stroke: color(q.p), opacity: 1 });
    tip.textContent = "";
    tip.append(q.p.name + " ");
    const b = document.createElement("b"); b.textContent = q.d.v + " %"; tip.append(b, " ");
    const s = document.createElement("span"); s.textContent = hhmm(q.d.ts) + (q.d.s ? " · " + q.d.s : ""); tip.append(s);
    tip.style.opacity = 1;
    tip.style.left = Math.min(q.x - sc.scrollLeft + 12, sc.clientWidth - tip.offsetWidth) + "px";
    tip.style.top = Math.max(0, q.y - tip.offsetHeight - 12) + "px";
  }
  sc.addEventListener("pointerdown", e => {
    if (e.button) return;
    drag = { x: e.clientX, s: sc.scrollLeft, moved: false };
    sc.setPointerCapture(e.pointerId);
  });
  sc.addEventListener("pointermove", e => {
    if (!drag) return hover(e);
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) < 4) return;
    if (!drag.moved) { drag.moved = true; sc.classList.add("drag"); hideTip(); }
    sc.scrollLeft = drag.s - dx;
    schedule();
  });
  sc.addEventListener("pointerup", e => {
    if (drag && !drag.moved) { const q = nearest(e); q ? toggleFocus(q.p.name) : focus && toggleFocus(focus); }
    drag = null;
    sc.classList.remove("drag");
  });
  sc.addEventListener("pointerleave", () => drag || hideTip());
  sc.addEventListener("scroll", schedule); // keeps pinned icons at the edges while the view moves
  $("toL").onclick = () => sc.scrollTo({ left: 0, behavior: "smooth" });
  $("toR").onclick = () => sc.scrollTo({ left: sc.scrollWidth, behavior: "smooth" });
  new ResizeObserver(schedule).observe($("plot"));

  // Settings popup. Durations live on the server (it removes projects); the theme stays in this browser.
  const post = path => fetch(path, { method: "POST" });
  let listKey = null;
  function list() {
    const key = projects.map(p => p.name + p.slot + p.icon).join("|");
    if (key === listKey) return;
    listKey = key;
    const ul = $("cList");
    ul.textContent = "";
    for (const p of projects) {
      const li = document.createElement("li");
      li.innerHTML = icoSvg(p, "ico") + `<span class="n"></span><button type="button" title="Retirer ce projet" aria-label="Retirer">✕</button>`;
      li.querySelector(".n").textContent = p.name;
      li.querySelector("button").onclick = () => post("/_del/" + encodeURIComponent(p.name));
      ul.append(li);
    }
    if (!projects.length) ul.innerHTML = `<li class="empty">Aucun projet.</li>`;
    $("cClear").disabled = !projects.length;
    $("nProj").textContent = projects.length || "";
  }
  function showTab(proj) {
    $("tabCfg").setAttribute("aria-selected", !proj); $("tabProj").setAttribute("aria-selected", proj);
    $("panCfg").hidden = proj; $("panProj").hidden = !proj; $("cClear").hidden = !proj;
  }
  $("tabCfg").onclick = () => showTab(false);
  $("tabProj").onclick = () => showTab(true);
  // Shows the values the server kept (it caps them), except in the field being typed in.
  function fillCfg() {
    for (const [id, v] of [["cWindow", cfg.window / 60], ["cDone", cfg.done / 60], ["cIdle", cfg.idle / 86400]])
      if (document.activeElement !== $(id)) $(id).value = Math.round(v);
  }
  $("gear").onclick = () => {
    fillCfg();
    $("cTheme").value = localStorage.getItem("theme") || "";
    listKey = null; list();
    $("dlg").showModal();
  };
  // Click outside closes; a text selection dragged from inside lands on the dialog too, so both ends must be outside the box.
  const outside = e => { const r = $("dlg").getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  let downOut = false;
  $("dlg").addEventListener("pointerdown", e => { downOut = outside(e); });
  $("dlg").addEventListener("click", e => { if (downOut && outside(e)) $("dlg").close(); downOut = false; });
  for (const [id, key, unit] of [["cWindow", "window", 60], ["cDone", "done", 60], ["cIdle", "idle", 86400]])
    $(id).addEventListener("change", () => {
      const n = Math.round($(id).value);
      if (n >= 1) post(`/_cfg?${key}=${n * unit}`);
    });
  $("cTheme").addEventListener("change", e => {
    const v = e.target.value;
    v ? localStorage.setItem("theme", v) : localStorage.removeItem("theme");
    v ? document.documentElement.dataset.theme = v : delete document.documentElement.dataset.theme;
  });
  $("cClear").onclick = () => { if (confirm("Effacer tous les projets du graphique ?")) post("/_clear"); };

  // Full state on connect, then one project per update; EventSource reconnects by itself.
  new EventSource("events").onmessage = e => apply(JSON.parse(e.data));
</script>
</body>
</html>
